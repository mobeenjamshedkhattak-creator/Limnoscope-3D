<style>
:root{--bg:#060f14;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#e8f4f7;--mu:#8fb0ba;--a:#2dd4bf;--b:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0e4a5a55,transparent),radial-gradient(900px 500px at -10% 10%,#14b8a633,transparent),var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1200px;margin:auto;padding:16px 24px 60px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;backdrop-filter:blur(10px);min-width:0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:20px}
label{font-size:.75rem;color:var(--mu);display:block;margin-bottom:4px}
input,textarea{width:100%;background:#0b1c24;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
button.go{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#04222a;font-weight:800;border-radius:10px;padding:11px 22px;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.8rem}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:.8rem}
.grid{display:grid;gap:14px;margin-top:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi b{font-size:1.9rem;display:block}.kpi span{color:var(--mu);font-size:.8rem}
h2{font-size:1rem;margin:0 0 10px;color:var(--a)}
#map{height:380px;border-radius:12px}.ch{position:relative;height:290px}.ban{background:#f59e0b22;border:1px solid #f59e0b66;color:#fcd34d;padding:10px 14px;border-radius:12px;margin-top:14px;font-size:.82rem}details summary{cursor:pointer;color:var(--a);font-weight:700}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.83rem}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}
.pill{padding:2px 9px;border-radius:99px;color:#fff;font-size:.72rem}
#st{color:var(--mu);margin-top:12px}.hide{display:none}
.note{font-size:.78rem;color:var(--mu);margin-top:18px}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}.form>:first-child{grid-column:1/-1}}

:root{--hf:"Plus Jakarta Sans",Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
html{scroll-behavior:smooth}img{max-width:100%}
.top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:18px max(22px,calc((100vw - 1200px)/2))}
.brand img{height:40px;display:block}
.links{display:flex;gap:34px}.links a{color:var(--tx);text-decoration:none;font-weight:600;font-size:.95rem;padding:6px 0;border-bottom:2px solid transparent;opacity:.85}
.links a:hover,.links a.act{border-color:var(--a);opacity:1}
.lang{display:flex}.lang button{background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--tx);padding:6px 14px;cursor:pointer;font-weight:600;backdrop-filter:blur(8px)}
.lang button:first-child{border-radius:99px 0 0 99px}.lang button:last-child{border-radius:0 99px 99px 0}.lang .on{background:linear-gradient(90deg,var(--a),var(--b));color:#04222a;border-color:transparent}
.hero{position:relative;min-height:min(100vh,880px);display:flex;flex-direction:column;justify-content:flex-end;padding:120px max(22px,calc((100vw - 1200px)/2)) 30px;background:linear-gradient(90deg,#061418 0,#061418ee 20%,#06141800 62%),linear-gradient(0deg,var(--bg) 0,#060f1400 28%),#061418 url(assets/hero.webp) 70% 0/cover no-repeat}
.hero-in{max-width:640px;margin-bottom:40px;animation:up .9s both}
.kick{color:var(--a);letter-spacing:.32em;font-size:.78rem;font-weight:700;margin-bottom:14px}
.hero h1{font:800 clamp(2.6rem,6.2vw,4.8rem)/1.02 var(--hf);margin:0 0 18px;letter-spacing:-.03em;text-shadow:0 4px 30px #0008}
.lead{color:#c3dae1;font-size:1.12rem;max-width:520px;margin:0}
.cta{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap}
button.big{padding:15px 30px;border-radius:99px;font-size:1rem;font-weight:700;cursor:pointer}
button.go.big{box-shadow:0 8px 30px #2dd4bf55}button.go.big:hover,button.go:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.ghost{background:rgba(6,20,24,.5);border:1.5px solid var(--a);color:var(--tx);backdrop-filter:blur(8px)}button.ghost:hover{background:rgba(45,212,191,.15)}
.panel{background:rgba(6,20,24,.72);border-radius:22px;padding:20px;animation:up 1.1s .15s both;box-shadow:0 20px 60px #0007}
.panel .form{margin-top:0}
.top-sec{max-width:1200px;margin:auto;padding:0 24px}
.cap{padding:70px max(22px,calc((100vw - 1200px)/2))}
.capwrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.h2big{font:800 clamp(1.8rem,4vw,2.8rem)/1.1 var(--hf);color:var(--tx);margin:0 0 12px;letter-spacing:-.02em}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:30px}
.fi{display:flex;gap:14px}.ico{flex:none;width:52px;height:52px;border:1.5px solid var(--a);border-radius:50%;display:grid;place-items:center;color:var(--a)}
.fi b{display:block;font-family:var(--hf);margin-bottom:3px}.fi span{color:var(--mu);font-size:.86rem}
.dio{text-align:center;position:relative}.dio:before{content:"";position:absolute;inset:8% 6%;background:radial-gradient(closest-side,#2dd4bf33,transparent);filter:blur(30px)}
.dio img{position:relative;width:100%;max-width:520px;animation:float 8s ease-in-out infinite;filter:drop-shadow(0 30px 40px #000a)}
.meth{padding:30px max(22px,calc((100vw - 1200px)/2)) 70px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.mg .glass b{font-family:var(--hf);color:var(--a);display:block;margin-bottom:6px}.mg .glass p{margin:0;color:var(--mu);font-size:.88rem}
footer{border-top:1px solid var(--bd);padding:26px 24px;text-align:center;color:var(--mu);font-size:.82rem;display:flex;gap:12px;justify-content:center;align-items:center}footer img{height:24px}
main{padding-top:30px}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media(max-width:900px){.capwrap{grid-template-columns:1fr}.links{display:none}.hero{background-position:62% 0}}
@media(max-width:560px){.feat{grid-template-columns:1fr}.brand img{height:32px}}
.form>*{min-width:0}input{min-width:0}.panel{max-width:100%}
@media(max-width:900px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}}

.fx{position:fixed;inset:0;z-index:100;background:#03080c;opacity:0;visibility:hidden;transition:opacity .6s ease}
.fx.on{opacity:1;visibility:visible}
.fx.out{opacity:0;transform:scale(1.35);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.5,0,.3,1)}
.fx canvas{width:100%;height:100%;display:block}
.fx:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,#03080c 100%);pointer-events:none}
.fxhud{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:80px 24px 56px;text-align:center;pointer-events:none;background:linear-gradient(0deg,#03080cdd,transparent)}
.fxkick{color:var(--a);letter-spacing:.35em;font-size:.72rem;font-weight:700}
.fxtitle{font:700 clamp(1.1rem,2.6vw,1.7rem) var(--hf);margin:8px 0 16px;min-height:1.4em}
.fxbar{width:min(360px,70vw);height:3px;background:#ffffff22;border-radius:9px;margin:auto;overflow:hidden}
.fxbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .9s ease}
#fxskip{position:absolute;top:22px;right:22px;z-index:3;pointer-events:auto}
.stp{position:relative;width:22px;height:22px}
.stp b{display:block;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 8px #000a}
.stp i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);animation:sping 2.2s ease-out infinite;animation-delay:var(--d)}
@keyframes sping{from{transform:scale(1);opacity:.95}to{transform:scale(3.4);opacity:0}}
</style></head><body>

const eq=(a,b)=>a[0]==b[0]&&a[1]==b[1];
function stitch(s){const o=[];s=s.slice();while(s.length){let c=s.pop(),g=true;while(g&&!eq(c[0],c[c.length-1])){g=false;for(let i=0;i<s.length;i++){const x=s[i];if(eq(c[c.length-1],x[0])){c=c.concat(x.slice(1));s.splice(i,1);g=true;break}if(eq(c[c.length-1],x[x.length-1])){c=c.concat(x.slice().reverse().slice(1));s.splice(i,1);g=true;break}}}if(eq(c[0],c[c.length-1])&&c.length>3)o.push(c)}return o}
const area=p=>{let a=0;for(let i=0;i<p.length-1;i++)a+=p[i][1]*p[i+1][0]-p[i+1][1]*p[i][0];return Math.abs(a/2)};
function pip(pt,p){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>pt[1])!=(p[j][1]>pt[1])&&pt[0]<(p[j][0]-p[i][0])*(pt[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0])ins=!ins}return ins}

 try{return await Promise.any(H.map(async h=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),20000);const j=await (await fetch(h,{method:'POST',body:'data='+encodeURIComponent(q),signal:c.signal})).json();clearTimeout(tm);const R=[];
  j.elements.forEach(e=>{if(e.type=='way'&&e.geometry){const p=e.geometry.map(g=>[g.lat,g.lon]);if(p.length>3&&eq(p[0],p[p.length-1]))R.push(p)}else if(e.type=='relation'&&e.members){stitch(e.members.filter(m=>m.role=='outer'&&m.geometry).map(m=>m.geometry.map(g=>[g.lat,g.lon]))).forEach(p=>R.push(p))}});

function farthest(C,ax){const d=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;let S=[C.reduce((m,p)=>p[ax]<m[ax]?p:m,C[0])];while(S.length<5){let best=null,bd=-1;C.forEach(p=>{const m=Math.min(...S.map(s=>d(p,s)));if(m>bd){bd=m;best=p}});S.push(best)}return S.sort((a,b)=>a[ax]-b[ax])}

/* ---------- Sentinel-2 & Landsat via Microsoft Planetary Computer ---------- */
let SAT=null;
const PCS='https://planetarycomputer.microsoft.com/api/stac/v1/search',PCD='https://planetarycomputer.microsoft.com/api/data/v1/item/point/';
async function pool(T,n){const o=[];let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<T.length){const k=i++;try{o[k]=await T[k]()}catch(e){o[k]=null}}}));return o}
async function stac(col,bb,a,b,q){try{const r=await fetch(PCS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collections:[col],bbox:bb,datetime:a+'T00:00:00Z/'+b+'T23:59:59Z',query:q,limit:200,sortby:[{field:'properties.eo:cloud_cover',direction:'asc'}]})});if(!r.ok)return[];return (await r.json()).features||[]}catch(e){return[]}}
function best(items,lo,la){const g={};items.forEach(it=>{const b=it.bbox;if(!b||lo<b[0]||lo>b[2]||la<b[1]||la>b[3])return;const m=it.properties.datetime.slice(0,7),c=it.properties['eo:cloud_cover']??100;if(!g[m]||c<g[m].c)g[m]={c,it}});return Object.values(g).map(x=>x.it)}
async function pv(col,it,lo,la,A){const u=PCD+lo+','+la+'?collection='+col+'&item='+encodeURIComponent(it.id)+A.map(a=>'&assets='+a).join('');const r=await fetch(u);if(!r.ok)return null;const j=await r.json();return j.values||null}
const turbF=r=>r<.16?228.1*r/(1-r/.1641):500;
async function s2obs(it,lo,la){const v=await pv('sentinel-2-l2a',it,lo,la,['B02','B03','B04','B05','B8A','B11','SCL']);if(!v||Math.round(v[6])!==6)return null;
 const off=String(it.properties['s2:processing_baseline']||'04.00')>='04.00'?1000:0,[b,g,r,re,n,sw]=v.slice(0,6).map(x=>(x-off)/1e4);if(!(b>0&&g>0&&r>0&&re>0))return null;
 const nd=(re-r)/(re+r);return{m:it.properties.datetime.slice(0,7),chl:clamp(14.039+86.115*nd+194.325*nd*nd,0,200),turb:turbF(r),fai:n-r-(sw-r)*.2116,cdom:ln(b/g),ndvi:(n-r)/(n+r)}}
async function lsobs(it,lo,la){const v=await pv('landsat-c2-l2',it,lo,la,['blue','green','red','nir08','lwir11','qa_pixel']);if(!v)return null;const qa=Math.round(v[5]);if((qa&30)||!((qa>>7)&1)||!v[4])return null;
 const sr=x=>x*2.75e-5-.2,[b,g,r,n]=v.slice(0,4).map(sr);if(!(b>0&&g>0&&r>0))return null;return{m:it.properties.datetime.slice(0,7),sst:v[4]*.00341802+149-273.15,turb:turbF(r),ndvi:(n-r)/(n+r),cdom:ln(b/g)}}
async function runSat(){if(!DATA||!STN.length)return;SAT=null;renderSat();
 try{const e=DATA.end,a=new Date(Math.max(new Date(DATA.start),new Date(e)-365*864e5)).toISOString().slice(0,10),lo=STN.map(s=>s.lo),la=STN.map(s=>s.la),bb=[Math.min(...lo)-.01,Math.min(...la)-.01,Math.max(...lo)+.01,Math.max(...la)+.01];
 const [s2,ls]=await Promise.all([stac('sentinel-2-l2a',bb,a,e,{'eo:cloud_cover':{lt:40}}),stac('landsat-c2-l2',bb,a,e,{'eo:cloud_cover':{lt:40},platform:{in:['landsat-8','landsat-9']}})]);
 const T=[];STN.forEach((s,i)=>{best(s2,s.lo,s.la).forEach(it=>T.push(async()=>{const o=await s2obs(it,s.lo,s.la);return o&&{...o,i,sen:'S2'}}));best(ls,s.lo,s.la).forEach(it=>T.push(async()=>{const o=await lsobs(it,s.lo,s.la);return o&&{...o,i,sen:'LS'}}))});
 SAT=(await pool(T,6)).filter(Boolean)}catch(x){SAT={err:String(x.message||x)}}
 renderSat()}
function satStats(){return STN.map((s,i)=>{const a=SAT.filter(o=>o.i==i&&o.sen=='S2'),b=SAT.filter(o=>o.i==i&&o.sen=='LS'),f=(r,k)=>r.length?mean(r.map(o=>o[k])):null;return{chl:f(a,'chl'),turb:f(a,'turb'),cdom:f(a,'cdom'),fai:f(a,'fai'),ndvi:f(a,'ndvi')??f(b,'ndvi'),sst:f(b,'sst'),n2:a.length,nl:b.length}})}
const fx=(x,d=2)=>x==null?'–':x.toFixed(d);
function renderSat(){const B=$('satban');if(!B)return;if(!SAT){B.textContent=t('satL');return}if(SAT.err){B.textContent=t('satE')+SAT.err;return}
 if(!SAT.length){B.textContent=t('satN');return}
 B.textContent=t('satOK')+(STN.some(s=>s.sat)?' '+t('applied'):'');
 const S=satStats(),L=STN.map(s=>s.n),mo=[...new Set(SAT.map(o=>o.m))].sort(),M=monthly(),all=SAT.map(o=>o.sst).filter(x=>x!=null),chs=S.map(x=>x.chl).filter(x=>x!=null);
 $('satk').innerHTML=[[t('kS2'),SAT.filter(o=>o.sen=='S2').length],[t('kLS'),SAT.filter(o=>o.sen=='LS').length],[t('kSC'),chs.length?mean(chs).toFixed(1):'–'],[t('kST'),all.length?mean(all).toFixed(1):'–']].map(k=>`<div class="glass kpi"><span>${k[0]}</span><b style="font-size:1.35rem">${k[1]}</b></div>`).join('');
 const ser=(sen,k)=>STN.map((s,i)=>({label:s.n,borderColor:COL[i],backgroundColor:COL[i],spanGaps:true,tension:.3,data:mo.map(m=>{const x=SAT.filter(o=>o.i==i&&o.sen==sen&&o.m==m&&o[k]!=null);return x.length?+mean(x.map(o=>o[k])).toFixed(2):null})}));
 mk('cS1',{type:'line',data:{labels:mo,datasets:ser('S2','chl')}});
 mk('cS2',{type:'bar',data:{labels:L,datasets:[{label:t('shM'),data:STN.map(s=>+s.m.chl.toFixed(1)),backgroundColor:'#38bdf8'},{label:t('shS'),data:S.map(x=>x.chl==null?null:+x.chl.toFixed(1)),backgroundColor:'#2dd4bf'}]}});
 mk('cS3',{type:'line',data:{labels:mo,datasets:ser('S2','turb')}});
 mk('cS4',{type:'line',data:{labels:mo,datasets:[{label:t('wst'),borderColor:'#ef4444',spanGaps:true,tension:.3,data:mo.map(m=>{const x=SAT.filter(o=>o.sen=='LS'&&o.m==m);return x.length?+mean(x.map(o=>o.sst)).toFixed(1):null})},{label:t('air'),borderColor:'#38bdf8',tension:.3,data:mo.map(m=>{const x=M.find(y=>y.m==m);return x?+x.t.toFixed(1):null})}]}});
 $('tsat').innerHTML=`<tr>${t('tsh').map(h=>`<th>${h}</th>`).join('')}</tr>`+S.map((x,i)=>`<tr><td>${L[i]}</td><td>${fx(x.chl,1)}</td><td>${fx(x.turb,1)}</td><td>${fx(x.cdom)}</td><td>${fx(x.fai,3)}</td><td>${fx(x.ndvi)}</td><td>${fx(x.sst,1)}</td><td>${x.n2}</td><td>${x.nl}</td></tr>`).join('')}
$('satRun').onclick=runSat;
$('satApply').onclick=()=>{if(!SAT||!SAT.length)return;const S=satStats();STN.forEach((s,i)=>{if(S[i].chl&&!s.sat){const f=S[i].chl/s.m.chl;s.ser.forEach(v=>v.chl=clamp(v.chl*f,.5,200));s.sat=true}});analyse();render();renderSat()};

/* ---------- cinematic fly-to: space -> lake (Three.js) ---------- */
const FX={on:false,skip:false,broken:false,arrived:false,fly:null,dir:null,dist:11,last:0,orb:0};
const lerp=(a,b,t)=>a+(b-a)*t,ease3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ease4=t=>t<.5?8*t**4:1-Math.pow(-2*t+2,4)/2;
function fxs(f){try{return f()}catch(e){console.warn('fx',e);FX.broken=true;try{fxClose()}catch(_){}}}
function fxSupported(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return false;if(!window.THREE)return false;const c=document.createElement('canvas');return !!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){return false}}
function ll2v(la,lo,r=1){const p=(90-la)*Math.PI/180,q=(lo+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(q),r*Math.cos(p),r*Math.sin(p)*Math.sin(q))}
function fxInit(){if(FX.R)return true;
 const cv=$('fxc'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.outputEncoding=THREE.sRGBEncoding;R.setClearColor(0x03080c,1);
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(42,1,.01,400),base='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r150/examples/textures/planets/',tl=new THREE.TextureLoader();tl.setCrossOrigin('anonymous');
 const load=(n,cb)=>tl.load(base+n,t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=8;cb(t)},undefined,()=>{});
 const em=new THREE.MeshPhongMaterial({color:0x2a6fa8,specular:new THREE.Color(0x335566),shininess:16}),earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),em);S.add(earth);
 load('earth_atmos_2048.jpg',t=>{em.map=t;em.color.set(0xffffff);em.needsUpdate=true});
 load('earth_specular_2048.jpg',t=>{t.encoding=THREE.LinearEncoding;em.specularMap=t;em.needsUpdate=true});
 const cm=new THREE.MeshPhongMaterial({transparent:true,opacity:.0,depthWrite:false}),clouds=new THREE.Mesh(new THREE.SphereGeometry(1.008,96,64),cm);S.add(clouds);
 load('earth_clouds_1024.png',t=>{cm.map=t;cm.opacity=.55;cm.needsUpdate=true});
 const atm=new THREE.Mesh(new THREE.SphereGeometry(1.14,64,48),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false,
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vN;void main(){float i=pow(max(0.72-dot(vN,vec3(0.,0.,1.)),0.),3.);gl_FragColor=vec4(.18,.83,.75,1.)*i*1.5;}'}));S.add(atm);
 const n=1800,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(90+Math.random()*40);pos.set([v.x,v.y,v.z],i*3)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfe8ff,size:.5,sizeAttenuation:true,transparent:true,opacity:.85})));
 const light=new THREE.DirectionalLight(0xffffff,1.45);S.add(light,new THREE.AmbientLight(0x6f8fb0,.55));
 Object.assign(FX,{R,S,C,earth,clouds,light});FX.pinG=new THREE.Group();FX.pinG.visible=false;S.add(FX.pinG);
 window.addEventListener('resize',()=>{if(FX.on)fxResize()});return true}
function fxResize(){FX.R.setSize(innerWidth,innerHeight,false);FX.C.aspect=innerWidth/innerHeight;FX.C.updateProjectionMatrix()}
function fxOpen(){FX.on=true;FX.skip=false;FX.broken=false;FX.arrived=false;FX.fly=null;FX.orb=Math.random()*6;FX.dir=new THREE.Vector3(1,.25,0);FX.dist=11;FX.last=0;FX.pinG.visible=false;fxResize();const o=$('fx');o.classList.remove('out');o.classList.add('on');document.body.style.overflow='hidden';requestAnimationFrame(fxLoop)}
function fxClose(){FX.on=false;const o=$('fx');o.classList.remove('on','out');document.body.style.overflow=''}
function fxReveal(){return new Promise(res=>{$('fx').classList.add('out');setTimeout(()=>{fxClose();res()},1200)})}
function fxStep(i,la,lo){const c=la==null?'':Math.abs(la).toFixed(3)+'°'+(la>=0?'N':'S')+', '+Math.abs(lo).toFixed(3)+'°'+(lo>=0?'E':'W');$('fxt').textContent=t('fx'+i).replace('{c}',c);$('fxb').style.width=(i*25)+'%'}
function fxFly(la,lo){return new Promise(res=>{const P=ll2v(la,lo).normalize(),G=FX.pinG;
 G.clear();G.position.copy(P).multiplyScalar(1.002);G.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),P);
 const mat=()=>new THREE.MeshBasicMaterial({color:0x2dd4bf,transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
 FX.rings=[0,1,2].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.0055,.0068,64),mat());G.add(m);return m});
 const dot=new THREE.Mesh(new THREE.SphereGeometry(.0042,16,12),new THREE.MeshBasicMaterial({color:0xeafffb}));G.add(dot);
 const bg=new THREE.CylinderGeometry(.0012,.0012,.22,12,1,true);bg.rotateX(Math.PI/2);bg.translate(0,0,.11);const beam=new THREE.Mesh(bg,mat());beam.material.opacity=.55;G.add(beam);
 FX.fly={a:FX.dir.clone().normalize(),P,d0:FX.dist,d1:1.5,t0:performance.now(),dur:FX.skip?1:4600,res};
 const q=document.getElementById('fxskip');q.onclick=()=>{FX.skip=true;if(FX.fly)FX.fly.t0=performance.now()-FX.fly.dur}})}
function fxLoop(now){if(!FX.on)return;requestAnimationFrame(fxLoop);
 try{const dt=Math.min(.05,(now-(FX.last||now))/1000);FX.last=now;const {C}=FX;FX.clouds.rotation.y+=dt*.02;let show=FX.arrived,pr=1;
  if(FX.fly){const f=FX.fly,u=clamp((now-f.t0)/f.dur,0,1),q=new THREE.Quaternion().setFromUnitVectors(f.a,f.P),qi=new THREE.Quaternion().slerp(q,ease3(u));
   FX.dir.copy(f.a).applyQuaternion(qi);FX.dist=lerp(f.d0,f.d1,ease4(u));show=u>.78;pr=clamp((u-.78)/.22,0,1);if(u>=1){FX.fly=null;FX.arrived=true;f.res()}}
  else if(!FX.arrived){FX.orb+=dt*.12;FX.dir.set(Math.cos(FX.orb)*.95,.25,Math.sin(FX.orb)*.95).normalize();FX.dist=lerp(FX.dist,6.2,Math.min(1,dt*1.6))}
  FX.pinG.visible=show;if(show&&FX.rings)FX.rings.forEach((m,i)=>{const ph=((now/1700)+i/3)%1;m.scale.setScalar(.3+ph*15);m.material.opacity=(1-ph)*.9*pr});
  C.position.copy(FX.dir).multiplyScalar(FX.dist);C.up.set(0,1,0);C.lookAt(0,0,0);FX.light.position.copy(C.position).add(new THREE.Vector3(-1.2,1.4,.6));FX.R.render(FX.S,C)}
 catch(e){console.warn('fx loop',e);FX.broken=true;if(FX.fly){const r=FX.fly.res;FX.fly=null;r()}}}
window.addEventListener('load',()=>{try{if(fxSupported())fxInit()}catch(e){}});
